{% extends "layout.html" %}

{% block title %}

    Register

{% endblock %}

{% block main %}

    <form action="/register" method="post">
        <input type="text" name="username" placeholder="Username" autofocus class="form-control mx-auto w-auto"><br>
        <input type="password" name="password" placeholder="Password" class="form-control mx-auto w-auto"><br>
        <input type="password" name="confirmation" placeholder="Password (again)" class="form-control mx-auto w-auto"><br>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <hr>
    <div class="alert alert-light" role="alert">{{ alert }}</div>

{% endblock %}
